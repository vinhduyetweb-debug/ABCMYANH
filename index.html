let lessons = [];
let current = 0;
let score = 0;

const lessonCard = document.getElementById('lessonCard');

document.getElementById('lettersMode').onclick = () => {
 lessons = letters;
 startMode();
}

document.getElementById('numbersMode').onclick = () => {
 lessons = numbers;
 startMode();
}

function startMode(){
 document.getElementById('modeSelect').classList.add('hidden');
 lessonCard.classList.remove('hidden');
 renderLesson();
}

function renderLesson(){
 const l = lessons[current];

 document.getElementById('emoji').innerText = l.emoji;
 document.getElementById('letter').innerText = l.letter;
 document.getElementById('word').innerText = l.word;
 document.getElementById('meaning').innerText = l.meaning;
 document.getElementById('sentence').innerText = l.sentence;
}

function speak(text, lang){
 speechSynthesis.cancel();

 const u = new SpeechSynthesisUtterance(text);

 u.lang = lang;
 u.rate = lang === 'vi-VN' ? 0.72 : 0.82;
 u.pitch = 1;
 u.volume = 1;

 const voices = speechSynthesis.getVoices();

 const voice = voices.find(v => v.lang.includes(lang.slice(0,2)));

 if(voice){
   u.voice = voice;
 }

 speechSynthesis.speak(u);
}

document.getElementById('letterBtn').onclick = () => {

 const currentLetter = lessons[current].letter;

 /* FIX: only pronounce one single character */
 const singleChar = currentLetter.toString().charAt(0);

 speak(singleChar, 'en-US');

}

document.getElementById('englishBtn').onclick = () => {
 speak(lessons[current].plain, 'en-US');
}

document.getElementById('vietnameseBtn').onclick = () => {
 speak(
 lessons[current].meaning + '. ' + lessons[current].sentence,
 'vi-VN'
 );
}

document.getElementById('nextBtn').onclick = () => {

 current = (current + 1) % lessons.length;

 score += 1;

 document.getElementById('score').innerText = score;

 clap();
 particles();

 renderLesson();

}

document.getElementById('prevBtn').onclick = () => {

 current = current === 0 ? lessons.length - 1 : current - 1;

 renderLesson();

}

function clap(){
 const audio = new Audio(
 'https://actions.google.com/sounds/v1/human_voices/applause.ogg'
 );

 audio.volume = .6;

 audio.play();
}

function particles(){

 for(let i=0;i<18;i++){

  const p = document.createElement('div');

  p.innerHTML =
  ['✨','🌈','⭐','💖'][Math.floor(Math.random()*4)];

  p.style.position='fixed';
  p.style.left=Math.random()*window.innerWidth+'px';
  p.style.top='55%';
  p.style.fontSize='30px';
  p.style.transition='1.2s ease-out';
  p.style.zIndex='9999';

  document.body.appendChild(p);

  setTimeout(()=>{
    p.style.transform=`translateY(-${Math.random()*350}px)`;
    p.style.opacity='0';
  },10);

  setTimeout(()=>{
    p.remove();
  },1200);

 }

}
