
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wonder ABC Universe V4</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header class="topbar">

<div class="brand">
<div class="logo">🌈</div>

<div>
<h1>Wonder ABC</h1>
<p>American English + Vietnamese Voice</p>
</div>
</div>

<div class="score-box">
✨ <span id="score">0</span>
</div>

</header>

<section class="hero-card">

<div>
<div class="pill">EMOTIONAL LEARNING WORLD</div>

<h2>Play • Listen • Learn</h2>

<p>
Interactive TikTok-style micro learning experience for kids.
</p>

<button id="startBtn" class="primary-btn">
Start Adventure 🚀
</button>

</div>

<div class="hero-character floating">
🐰
</div>

</section>

<section id="lessonCard" class="lesson-card hidden">

<div class="lesson-top">
<span class="mini-pill">AI FIRST</span>
<span class="mini-pill">MICRO LEARNING</span>
</div>

<div class="letter-box pulse">

<h1 id="letter"></h1>

<h3 id="word"></h3>

<p class="phonetic" id="phonetic"></p>

<p class="meaning" id="meaning"></p>

</div>

<div class="buttons">

<button id="letterBtn" class="secondary-btn">
🔤 Letter
</button>

<button id="englishBtn" class="secondary-btn">
🇺🇸 English
</button>

<button id="vietnameseBtn" class="secondary-btn">
🇻🇳 TiengViet
</button>

</div>

<div class="quiz">

<h3 id="quizTitle"></h3>

<div class="choices" id="choices"></div>

</div>

<div class="nav-buttons">

<button id="prevBtn" class="nav-btn">
⬅ Back
</button>

<button id="nextBtn" class="nav-btn">
Next ➡
</button>

</div>

</section>

<section id="rewardCard" class="reward-card hidden">

<div class="reward-icon bounce">
🎉
</div>

<h2>Excellent!</h2>

<p>
Luna Bunny is cheering for you!
</p>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
