
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Adventure V3</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="sky"></div>
<div class="stars"></div>

<div class="app">

<header class="topbar">
<div>
<h1>ABC Adventure V3</h1>
<p>Interactive Emotional English World</p>
</div>

<div class="hud">
<div class="xp">⭐ <span id="xp">0</span></div>
<div class="level">🏆 Lv <span id="level">1</span></div>
</div>
</header>

<section class="world-card">
<div class="world-title">
🌈 Magic Forest World
</div>

<div class="progress-wrap">
<div class="progress-bar" id="progressBar"></div>
</div>
</section>

<section class="hero-card">

<div class="mascot" id="mascot">🐰</div>

<div class="speech-bubble" id="speechBubble">
Hello little hero!
</div>

</section>

<section class="lesson-card">

<div class="letter-box">
<div class="letter" id="letter">A</div>
<div class="word" id="word">Apple 🍎</div>
</div>

<button id="voiceBtn" class="voice-btn">
🔊 British Voice
</button>

</section>

<section class="quiz-card">

<h2>Choose The Correct Word</h2>

<div class="choices" id="choices"></div>

<div class="feedback" id="feedback"></div>

</section>

<section class="reward-card">

<div class="reward-header">
<h2>Magic Sticker Book</h2>
<div class="combo">🔥 Combo <span id="combo">0</span></div>
</div>

<div class="stickers" id="stickers"></div>

</section>

<section class="chest-card" id="chestCard">

<div class="chest">🎁</div>

<h2>Treasure Reward</h2>

<p>Get 5 correct answers to unlock a magic surprise!</p>

<button id="openChestBtn" class="open-btn">
Open Treasure
</button>

</section>

</div>

<div id="fxLayer"></div>

<script src="app.js"></script>
</body>
</html>
