<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Adventure V2</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="floating-stars"></div>

<div class="app">

<header class="topbar">
<div>
<h1>ABC Adventure</h1>
<p>Learn English Through Play</p>
</div>

<div class="xp-box">
⭐ <span id="xp">0</span>
</div>
</header>

<section class="hero">
<div class="mascot">🐰</div>

<div>
<h2>Welcome Little Hero!</h2>
<p>Tap the right answer and collect magic stickers.</p>
</div>
</section>

<section class="lesson-card">
<div class="level-box">
LEVEL <span id="level">1</span>
</div>

<div class="letter" id="letter">A</div>
<div class="word" id="word">Apple 🍎</div>

<button id="speakBtn" class="primary-btn">
🔊 British Voice
</button>
</section>

<section class="game-card">
<h2>Choose The Correct Word</h2>

<div class="choices" id="choices"></div>

<div id="feedback" class="feedback"></div>
</section>

<section class="reward-card">
<h2>Sticker Collection</h2>

<div class="stickers" id="stickers"></div>
</section>

</div>

<div id="fireworks"></div>
<div id="bubbleArea"></div>

<script src="app.js"></script>
</body>
</html>
