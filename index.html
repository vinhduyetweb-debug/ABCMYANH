const chibiImages = [
'https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800&auto=format&fit=crop',
'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=800&auto=format&fit=crop',
'https://images.unsplash.com/photo-1517365830460-955ce3ccd263?q=80&w=800&auto=format&fit=crop',
'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=800&auto=format&fit=crop'
];

let current = 0;
let score = 0;

const lessonCard = document.getElementById('lessonCard');

document.getElementById('startBtn').onclick = () => {
 lessonCard.classList.remove('hidden');
 renderLesson();
}

function renderLesson(){
 const l = lessons[current];

 document.getElementById('letter').innerText = l.letter;
 document.getElementById('word').innerText = l.word;
 document.getElementById('meaning').innerText = l.meaning;
 document.getElementById('phonetic').innerText = l.phonetic || '';
 document.getElementById('lessonImage').src = chibiImages[current % chibiImages.length];
}

function speak(text, lang){
 speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(text);
 u.lang = lang;
 u.rate = lang === 'vi-VN' ? 0.72 : 0.82;
 u.pitch = 1;
 const voices = speechSynthesis.getVoices();
 const voice = voices.find(v => v.lang.includes(lang.slice(0,2)));
 if(voice){u.voice = voice;}
 speechSynthesis.speak(u);
}

document.getElementById('letterBtn').onclick = ()=> {
 speak(lessons[current].letter, 'en-US');
}

document.getElementById('englishBtn').onclick = ()=> {
 speak(lessons[current].plainWord, 'en-US');
}

document.getElementById('vietnameseBtn').onclick = ()=> {
 speak(lessons[current].meaning, 'vi-VN');
}

document.getElementById('nextBtn').onclick = ()=> {
 current = (current + 1) % lessons.length;
 score += 1;
 document.getElementById('score').innerText = score;
 clap();
 renderLesson();
}

document.getElementById('prevBtn').onclick = ()=> {
 current = current === 0 ? lessons.length -1 : current -1;
 renderLesson();
}

function clap(){
 const audio = new Audio('https://actions.google.com/sounds/v1/human_voices/applause.ogg');
 audio.volume = .6;
 audio.play();
}
